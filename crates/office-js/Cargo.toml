[package]
name = "gridcraft-office-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft's Office JavaScript API (Office.onReady, Excel.run) for Office add-ins' task panes, in Rust compiled to wasm"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
gridcraft-engine = { workspace = true }
gridcraft-plugin = { workspace = true }
